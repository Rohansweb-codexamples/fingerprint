services:

  - type: web
    name: fingerprint-manager
    runtime: node

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fingerprint-database
          property: connectionString

      - key: NODE_ENV
        value: production

databases:

  - name: fingerprint-database
    plan: free
    region: frankfurt
